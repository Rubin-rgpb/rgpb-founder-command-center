name: Restore pre-existing RGPB Founder Command Center v0.1.2
on:
  push:
    paths:
      - '.build/source.br.b64'
      - '.github/workflows/restore-source.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  restore-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore original source files
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),zlib=require('zlib');
          const encoded=fs.readFileSync('.build/source.br.b64','utf8').trim();
          const source=zlib.brotliDecompressSync(Buffer.from(encoded,'base64')).toString('utf8');
          const entries=source.split('\0');
          if(entries.length!==37 || entries[36]!=='') throw Error('Unexpected source archive shape');
          for(let i=0;i<36;i+=2){
            const filename=entries[i];
            if(!filename || filename.startsWith('/') || filename.includes('..')) throw Error('Invalid path: '+filename);
            fs.mkdirSync(path.dirname(filename),{recursive:true});
            fs.writeFileSync(filename,entries[i+1],'utf8');
          }
          console.log('Restored 18 original source files');
          NODE
      - name: Commit source files without touching workflow permissions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore .env.example README.md next-env.d.ts next.config.ts package.json public src supabase tsconfig.json
          git diff --cached --quiet || (git commit -m "Restore original v0.1.2 app source without workflow changes" && git push)
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build static site
        run: |
          export NEXT_PUBLIC_BASE_PATH="/${{ github.event.repository.name }}"
          npm run build
      - name: Verify and package output
        run: test -f out/index.html && test -d out/_next && touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    needs: restore-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
